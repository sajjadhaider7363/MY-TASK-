const COLORS = ['Red','Blue','Black','White','Green'];
const SIZES = ['S','M','L','XL','XXL'];

const TITLES = {
  football:['Pro Football Jersey','Football Hoodie','Training Pants','Game Jacket','Practice T-Shirt'],
  basketball:['Pro Basketball Jersey','Shorts Pro','Warm-Up Hoodie','High-Top Shoes','Headband Set'],
  soccer:['Official Soccer Jersey','Training Pants','Shin Guards Kit','Lightweight Cleats','Practice Jersey'],
  rugby:['Match Shirt Heavy','Tough Shorts','Headgear Guard','Training Ball Kit','Socks Long'],
  baseball:['Game Jersey','Cap Pro','Pants Kneepad','Belt','Cleats Metal'],
  shoes:['Football Cleats Pro','Basketball High-Tops','Soccer Cleats FG','Running Shoes Elite','Cross-Trainers'],
  accessories:['Water Bottle','Wristbands 2 Pack','Backpack','Ankle Socks 6 Pack','Duffel Bag']
};

const CATEGORIES = ['football','basketball','soccer','rugby','baseball','shoes','accessories'];
const CATNAMES = {football:'Football',basketball:'Basketball',soccer:'Soccer',rugby:'Rugby',baseball:'Baseball',shoes:'Shoes',accessories:'Accessories'};
const PRICES = {football:{min:600,max:9500},basketball:{min:500,max:8500},soccer:{min:500,max:9000},rugby:{min:600,max:8500},baseball:{min:400,max:8000},shoes:{min:1500,max:12000},accessories:{min:200,max:5000}};

let allProducts = [];
let pid = 1;

CATEGORIES.forEach(cat => {
  const titles = TITLES[cat];
  const imgArr = SPECIFIC_IMAGES[cat];
  const pr = PRICES[cat];
  const cn = CATNAMES[cat];
  
  titles.forEach((t,i) => {
    const c = COLORS[i % COLORS.length];
    const s = SIZES[i % SIZES.length];
    const p = Math.round((pr.min + Math.random()*(pr.max-pr.min))/50)*50;
    allProducts.push({
      id: pid++,
      title: t + ' - ' + c + '/' + s,
      price: p,
      img: imgArr[i],
      category: cn,
      catKey: cat
    });
  });
});

let cart = JSON.parse(localStorage.getItem('shopCart1000')) || [];

function renderProducts(products) {
  const grid = document.getElementById('shop-products-grid');
  if(!products.length) {
    grid.innerHTML = '<div class="no-products">😕 No products found.</div>';
    return;
  }
  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <div>
        <img src="${p.img}" alt="${p.title}" loading="lazy">
        <span class="product-category">${p.category}</span>
        <h4 class="product-title">${p.title}</h4>
      </div>
      <div>
        <div class="product-footer">
          <span class="product-price">Rs. ${p.price.toLocaleString()}</span>
          <button class="buy-btn" onclick="addToCart(${p.id})">🛒 Add</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterProducts(catKey, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(catKey === 'all') renderProducts(allProducts);
  else renderProducts(allProducts.filter(p => p.catKey === catKey));
}

function addToCart(id) {
  const p = allProducts.find(x => x.id === id);
  if(p) { cart.push(p); localStorage.setItem('shopCart1000',JSON.stringify(cart)); updateCartUI(); openCartDrawer(); }
}

function removeFromCart(i) { cart.splice(i,1); localStorage.setItem('shopCart1000',JSON.stringify(cart)); updateCartUI(); }

function updateCartUI() {
  document.getElementById('cart-count').textContent = cart.length;
  const c = document.getElementById('cart-items-container');
  const t = document.getElementById('cart-total');
  if(!cart.length) {
    c.innerHTML = '<p style="color:#9ca3af;text-align:center;margin-top:40px">🛒 Cart is empty.</p>';
    t.textContent = 'Rs. 0';
    return;
  }
  let total = 0;
  c.innerHTML = cart.map((it,i) => {
    total += it.price;
    return '<div style="background:#1f293d;padding:12px;border-radius:8px;display:flex;align-items:center;gap:12px">'+
      '<img src="'+it.img+'" style="width:55px;height:55px;object-fit:cover;border-radius:6px">'+
      '<div style="flex-grow:1"><h4 style="font-size:13px;color:#fff;margin-bottom:4px">'+it.title+'</h4>'+
      '<span style="font-size:13px;color:#cbef33;font-weight:700">Rs. '+it.price.toLocaleString()+'</span></div>'+
      '<button onclick="removeFromCart('+i+')" style="background:0;border:0;color:#ef4444;font-size:20px;cursor:pointer">&times;</button></div>';
  }).join('');
  t.textContent = 'Rs. '+total.toLocaleString();
}

function openCartDrawer() { document.getElementById('cart-drawer').style.display = 'flex'; }
function closeCartDrawer() { document.getElementById('cart-drawer').style.display = 'none'; }

document.addEventListener('click', function(e) {
  const d = document.getElementById('cart-drawer');
  if(d.style.display === 'flex' && !d.contains(e.target) && !e.target.closest('.nav-actions')) closeCartDrawer();
});

document.addEventListener('DOMContentLoaded', () => {
  renderProducts(allProducts);
  updateCartUI();
});
</script>
